[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simcert"
version = "0.1.0"
description = "SimCert — a classical-simulability audit of trained QNLP text models"
authors = [{ name = "tanvir" }]
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end tests that train/export a real model",
    "needs_lambeq: requires the qnlp-lambeq (Python 3.11) environment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741"]  # allow single-char names like chi, S in scientific code
